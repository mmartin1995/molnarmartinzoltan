<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visszaszámláló – Projektek + ICS</title>
  <style>
    :root{
      --bg: #0f1221;
      --panel: #171a2b;
      --panel-2:#1e2236;
      --text:#e8ebff;
      --muted:#a6acd3;
      --acc:#6ea8fe;
      --good:#35d399;
      --warn:#ffcc66;
      --bad:#ff6b6b;
      --border: #2a2f4a;
      --shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    *{box-sizing: border-box}
    html,body{height:100%}
    body{margin:0;background:linear-gradient(180deg,var(--bg),#0a0d1a);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Helvetica,Arial,sans-serif;}
    .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
    aside{background:var(--panel);border-right:1px solid var(--border);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
    main{padding:24px;}
    h1{font-size:20px;margin:0 0 14px}
    h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
    .btn{display:inline-flex;gap:.5rem;align-items:center;background:var(--acc);color:#07112b;border:none;padding:10px 12px;border-radius:12px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
    .btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
    .row{display:flex;gap:10px;align-items:center}
    .stack{display:grid;gap:10px}
    .input, select, textarea{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px}
    .tag{display:inline-flex;gap:.4rem;align-items:center;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--border);font-size:12px}
    .list{display:grid;gap:10px}

    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
    .toolbar .spacer{flex:1}

    .card{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px 12px;box-shadow:var(--shadow)}
    .drag{cursor:grab;color:var(--muted);user-select:none}
    .title{font-weight:700}
    .until{font-variant-numeric:tabular-nums}
    .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
    .pill{padding:.15rem .5rem;border-radius:999px;background:var(--panel-2);border:1px solid var(--border)}
    .actions{display:flex;gap:6px}

    .divider{height:1px;background:var(--border);margin:12px 0}

    dialog{border:none;border-radius:16px;padding:0;background:transparent}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;min-width:320px;max-width:520px;box-shadow:var(--shadow)}
    .modal header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
    .modal .content{padding:14px 16px}
    .modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 16px;border-top:1px solid var(--border)}

    .sidebar-card{background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:12px}

    .calendar-list{display:grid;gap:6px}
    .cal-item{padding:8px;border:1px dashed var(--border);border-radius:12px}
    .event{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:10px}
    .event:hover{background:rgba(110,168,254,.1)}
    .event .when{color:var(--muted);font-variant-numeric:tabular-nums}
    small.helper{color:var(--muted)}

    .empty{opacity:.7;text-align:center;padding:36px;border:1px dashed var(--border);border-radius:16px}

    .archived{opacity:.55}

    .project-dot{width:10px;height:10px;border-radius:999px;display:inline-block;border:1px solid rgba(255,255,255,.3)}

    /* Project font previews applied via [data-project-font] */
    [data-project-font="serif"]{font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif}
    [data-project-font="mono"]{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace}
    [data-project-font="display"]{font-family: "Trebuchet MS", Verdana, Geneva, Tahoma, sans-serif}

    @media (max-width: 900px){
      .app{grid-template-columns:1fr}
      aside{position:static;height:auto}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>⏳ Visszaszámláló</h1>
      <div class="sidebar-card stack">
        <button class="btn" id="btnNewCounter">+ Új számláló</button>
        <div class="row">
          <label class="pill" style="cursor:pointer">
            <input id="showArchived" type="checkbox" /> Archiváltak megjelenítése
          </label>
        </div>
      </div>

      <h2>Stílus</h2>
      <div class="sidebar-card stack">
        <div class="row">
          <label class="pill">Rendezés</label>
          <select id="sortMode">
            <option value="manual">Manuális</option>
            <option value="project">Projekt szerint</option>
            <option value="asc">Lejárat növekvő</option>
            <option value="desc">Lejárat csökkenő</option>
          </select>
        </div>
        <div class="row">
          <label class="pill">Projekt szűrő</label>
          <select id="projectFilter"></select>
        </div>
      </div>

      <h2>Naptárak (.ics)</h2>
      <div class="sidebar-card">
        <div class="stack">
          <input id="icsInput" type="file" accept=".ics,text/calendar" multiple class="input" />
          <small class="helper">Dupla katt egy eseményre → előtöltött számláló létrehozás</small>
          <div id="calendarList" class="calendar-list"></div>
        </div>
      </div>

      <h2>Projektek</h2>
      <div class="sidebar-card stack" id="projectsPanel"></div>
      <div class="stack" style="margin-top:8px">
        <button class="btn secondary" id="btnNewProject">+ Új projekt…</button>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="spacer"></div>
        <div class="row" style="gap:6px">
          <span class="pill">Aktív időzítők: <b id="activeCount">0</b></span>
          <span class="pill">Zóna: <b id="tzLabel">{{ target_tz }}</b></span>
        </div>
      </div>

      <div id="list" class="list"></div>
      <div id="emptyState" class="empty" style="display:none">
        Nincs még számláló. Katt a <b>+ Új számláló</b> gombra, vagy importálj .ics fájlt.
      </div>
    </main>
  </div>

  <!-- Számláló modal -->
  <dialog id="counterDialog">
    <form method="dialog" class="modal" id="counterForm">
      <header>
        <strong id="dlgTitle">Új számláló</strong>
        <button class="btn ghost" type="button" data-close>Bezár</button>
      </header>
      <div class="content stack">
        <input type="hidden" id="counterId" />
        <label class="stack">
          <span>Név</span>
          <input id="counterName" class="input" required placeholder="Pl. 'Határidő a pályázathoz'" />
        </label>
        <label class="stack">
          <span>Lejárat (helyi idő)</span>
          <input id="counterWhen" type="datetime-local" class="input" required />
        </label>
        <label class="stack">
          <span>Projekt</span>
          <div class="row" style="gap:8px">
            <select id="counterProject" class="input" style="flex:1"></select>
            <button class="btn secondary" type="button" id="btnQuickNewProject">Új projekt…</button>
          </div>
        </label>
      </div>
      <footer>
        <button class="btn secondary" type="button" id="btnDeleteCounter" style="display:none">Törlés</button>
        <div style="flex:1"></div>
        <button class="btn" id="btnSaveCounter" type="submit">Mentés</button>
      </footer>
    </form>
  </dialog>

  <!-- Projekt modal -->
  <dialog id="projectDialog">
    <form method="dialog" class="modal" id="projectForm">
      <header>
        <strong id="projDlgTitle">Új projekt</strong>
        <button class="btn ghost" type="button" data-close>Bezár</button>
      </header>
      <div class="content stack">
        <input type="hidden" id="projectId" />
        <label class="stack">
          <span>Név</span>
          <input id="projectName" class="input" required placeholder="Pl. 'Munka', 'Suli'" />
        </label>
        <label class="stack">
          <span>Szín</span>
          <input id="projectColor" class="input" type="color" value="#6ea8fe" />
        </label>
        <label class="stack">
          <span>Betűtípus</span>
          <select id="projectFont" class="input">
            <option value="default">Alapértelmezett</option>
            <option value="serif">Serif</option>
            <option value="mono">Mono</option>
            <option value="display">Display</option>
          </select>
        </label>
      </div>
      <footer>
        <button class="btn secondary" type="button" id="btnDeleteProject" style="display:none">Törlés</button>
        <div style="flex:1"></div>
        <button class="btn" id="btnSaveProject" type="submit">Mentés</button>
      </footer>
    </form>
  </dialog>

  <template id="tplProjectChip">
    <span class="tag"><span class="project-dot"></span><b class="name"></b></span>
  </template>

  <script>
  // ======= Állapot és tárolás =======
  const tzLabel = document.getElementById('tzLabel');
  const store = {
    key: 'visszaszamlalo_v3',
    load(){
      try{ const raw = localStorage.getItem(this.key); return raw? JSON.parse(raw): null; }catch{ return null }
    },
    save(data){ localStorage.setItem(this.key, JSON.stringify(data)); }
  };

  const state = {
    counters: [], // {id,name,deadline,projectId,archived:false,createdAt,order}
    projects: [], // {id,name,color,font}
    showArchived: false,
    sortMode: 'manual',
    projectFilter: 'all',
    calendars: [], // session only: {id,name,events:[{uid,summary,dtstart,dtend}]}
  };

  // ======= Util =======
  const uid = (p='id')=> p+"_"+Math.random().toString(36).slice(2,9);
  const clamp = (n,min,max)=> Math.min(max,Math.max(min,n));
  const fmtDateTime = (ms)=> new Date(ms).toLocaleString();
  const parseLocalDateTime = (val)=> val? new Date(val).getTime(): null; // datetime-local → ms
  const setSecondAlignedInterval = (cb)=>{
    const tick = ()=>{ cb(); }
    const delay = 1000 - (Date.now() % 1000);
    setTimeout(()=>{ tick(); setInterval(tick, 1000); }, delay);
  }
  function humanRemaining(ms){
    const sign = ms<0 ? -1 : 1; ms = Math.abs(ms);
    const s = Math.floor(ms/1000);
    const d = Math.floor(s/86400);
    const h = Math.floor((s%86400)/3600);
    const m = Math.floor((s%3600)/60);
    const sec = s%60;
    const pad=(n)=> String(n).padStart(2,'0');
    const core = `${d} nap ${pad(h)}:${pad(m)}:${pad(sec)}`;
    return sign<0? `Lejárt ${core}`: core;
  }
  function byId(arr,id){ return arr.find(x=>x.id===id) }

  // ======= Kezdeti betöltés =======
  (function init(){
    const saved = store.load();
    if(saved){ Object.assign(state, saved); }
    else{
      // Ha a Flask sablon átadott egy célidőt, készítsünk mintát első indításkor
      const target = Number('{{ target_epoch_ms }}');
      const name = 'Mintaszámláló – {{ target_str }}';
      if(target){
        const projId = uid('prj');
        state.projects.push({id:projId,name:'Alap',color:'#6ea8fe',font:'default'});
        state.counters.push({id:uid('ctr'),name,deadline:target,projectId:projId,archived:false,createdAt:Date.now(),order:0});
      }
    }
    renderAll();
    setSecondAlignedInterval(tick);
  })();

  function persist(){
    store.save({
      counters: state.counters,
      projects: state.projects,
      showArchived: state.showArchived,
      sortMode: state.sortMode,
      projectFilter: state.projectFilter,
    });
  }

  // ======= Render =======
  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('emptyState');
  const activeCountEl = document.getElementById('activeCount');
  const sortSel = document.getElementById('sortMode');
  const showArchivedChk = document.getElementById('showArchived');
  const projectFilterSel = document.getElementById('projectFilter');

  function tick(){
    // csak a számlálók idejét frissítjük
    document.querySelectorAll('[data-deadline]').forEach(el=>{
      const ms = Number(el.getAttribute('data-deadline')) - Date.now();
      el.querySelector('.until').textContent = humanRemaining(ms);
      const bar = el.querySelector('.bar');
      if(bar){ // progress becslés, ha < 30 napos
        const created = Number(el.getAttribute('data-created'))||Date.now();
        const total = Number(el.getAttribute('data-deadline')) - created;
        const passed = Date.now()-created;
        const pct = total>0? clamp(Math.round(passed/total*100),0,100) : 100;
        bar.style.width = pct+"%";
      }
    })
  }

  function renderAll(){
    // beállítások
    sortSel.value = state.sortMode; showArchivedChk.checked = state.showArchived;

    // projekt szűrő feltöltése
    projectFilterSel.innerHTML = '';
    const optAll = document.createElement('option'); optAll.value='all'; optAll.textContent='(Összes projekt)'; projectFilterSel.appendChild(optAll);
    state.projects.forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; projectFilterSel.appendChild(o); });
    projectFilterSel.value = state.projectFilter || 'all';

    // projektek panel
    renderProjectsPanel();

    // számlálók
    renderList();

    persist();
  }

  function visibleCounters(){
    return state.counters.filter(c=> (state.showArchived || !c.archived) && (state.projectFilter==='all' || c.projectId===state.projectFilter) );
  }

  function sortCounters(arr){
    const mode = state.sortMode;
    if(mode==='manual') return arr.sort((a,b)=> (a.order??0)-(b.order??0));
    if(mode==='project') return arr.sort((a,b)=> (byId(state.projects,a.projectId)?.name||'').localeCompare(byId(state.projects,b.projectId)?.name||'' ) || (a.deadline-b.deadline));
    if(mode==='asc') return arr.sort((a,b)=> a.deadline-b.deadline);
    if(mode==='desc') return arr.sort((a,b)=> b.deadline-a.deadline);
    return arr;
  }

  function renderList(){
    listEl.innerHTML='';
    const items = sortCounters(visibleCounters().slice());

    activeCountEl.textContent = state.counters.filter(c=>!c.archived).length;
    emptyEl.style.display = items.length? 'none':'block';

    items.forEach((c,idx)=>{
      const p = byId(state.projects,c.projectId) || {name:'(nincs projekt)', color:'#888', font:'default'};

      const card = document.createElement('div');
      card.className = 'card' + (c.archived? ' archived':'');
      card.setAttribute('data-id', c.id);
      card.setAttribute('data-deadline', c.deadline);
      card.setAttribute('data-created', c.createdAt||Date.now());
      card.draggable = state.sortMode==='manual';

      const drag = document.createElement('div'); drag.className='drag'; drag.innerHTML='☰';
      const center = document.createElement('div');
      const right = document.createElement('div'); right.className='actions';

      // közép
      const title = document.createElement('div'); title.className='title'; title.textContent = c.name; title.title='Kattintás: szerkesztés';
      title.style.cursor='pointer';
      title.addEventListener('click', ()=> openCounterDialog(c));

      const meta = document.createElement('div'); meta.className='meta';
      const tag = document.getElementById('tplProjectChip').content.firstElementChild.cloneNode(true);
      tag.querySelector('.name').textContent = p.name;
      tag.querySelector('.project-dot').style.background = p.color;
      tag.setAttribute('data-project-font', p.font||'default');

      const when = document.createElement('span'); when.className='pill when'; when.textContent = new Date(c.deadline).toLocaleString();
      const until = document.createElement('span'); until.className='pill until';
      meta.append(tag, when, until);

      const barWrap = document.createElement('div'); barWrap.style.height='4px'; barWrap.style.background='rgba(255,255,255,.08)'; barWrap.style.border='1px solid var(--border)'; barWrap.style.borderRadius='999px'; barWrap.style.overflow='hidden'; barWrap.title='Becsült előrehaladás (létrehozástól a lejáratig)';
      const bar = document.createElement('div'); bar.className='bar'; bar.style.height='100%'; bar.style.width='0%'; bar.style.background=p.color; barWrap.append(bar);

      center.append(title, meta, barWrap);

      // jobb oldali gombok
      const btnEdit = document.createElement('button'); btnEdit.className='btn secondary'; btnEdit.textContent='Szerk.'; btnEdit.onclick=()=>openCounterDialog(c);
      const btnArchive = document.createElement('button'); btnArchive.className='btn secondary'; btnArchive.textContent= c.archived? 'Visszaállít':'Archiválás';
      btnArchive.onclick=()=>{ c.archived=!c.archived; renderAll(); };
      right.append(btnEdit, btnArchive);

      card.append(drag, center, right);

      // Drag & drop csak manuális módban
      if(state.sortMode==='manual'){
        card.addEventListener('dragstart', (e)=>{ e.dataTransfer.setData('text/plain', c.id); e.dataTransfer.effectAllowed='move'; });
        card.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; });
        card.addEventListener('drop', (e)=>{
          e.preventDefault();
          const fromId = e.dataTransfer.getData('text/plain');
          const toId = c.id;
          reorder(fromId,toId);
        });
      }

      listEl.append(card);
    });

    tick();
  }

  function reorder(fromId,toId){
    if(fromId===toId) return;
    const arr = sortCounters(visibleCounters().slice());
    const fromIdx = arr.findIndex(x=>x.id===fromId);
    const toIdx = arr.findIndex(x=>x.id===toId);
    if(fromIdx<0||toIdx<0) return;
    // új sorrend az összes elemre (látható halmazon belül)
    const [moved] = arr.splice(fromIdx,1);
    arr.splice(toIdx,0,moved);
    // order értékek kiosztása
    arr.forEach((c,i)=>{ const real = state.counters.find(x=>x.id===c.id); if(real) real.order = (real.orderBase||0) + i; });
    persist(); renderList();
  }

  // ======= Projektek panel =======
  const projectsPanel = document.getElementById('projectsPanel');
  function renderProjectsPanel(){
    projectsPanel.innerHTML='';
    if(!state.projects.length){
      const empty = document.createElement('div'); empty.className='empty'; empty.textContent='Nincs projekt. Hozz létre egyet!'; projectsPanel.append(empty); return;
    }
    state.projects.forEach(p=>{
      const row = document.createElement('div'); row.className='row'; row.style.justifyContent='space-between'; row.style.alignItems='center';
      const left = document.createElement('div'); left.className='row'; left.style.gap='8px';
      const dot = document.createElement('span'); dot.className='project-dot'; dot.style.background=p.color;
      const name = document.createElement('span'); name.textContent=p.name; name.setAttribute('data-project-font', p.font||'default');
      left.append(dot,name);
      const right = document.createElement('div');
      const b = document.createElement('button'); b.className='btn secondary'; b.textContent='Szerk.'; b.onclick=()=>openProjectDialog(p);
      right.append(b);
      row.append(left,right);
      projectsPanel.append(row);
    });
  }

  // ======= Számláló létrehozás/szerkesztés =======
  const counterDialog = document.getElementById('counterDialog');
  const counterForm = document.getElementById('counterForm');
  const counterId = document.getElementById('counterId');
  const counterName = document.getElementById('counterName');
  const counterWhen = document.getElementById('counterWhen');
  const counterProject = document.getElementById('counterProject');
  const btnDeleteCounter = document.getElementById('btnDeleteCounter');
  const btnQuickNewProject = document.getElementById('btnQuickNewProject');

  document.querySelectorAll('dialog [data-close]').forEach(b=> b.addEventListener('click', e=> e.target.closest('dialog').close() ));

  function fillProjectSelect(sel){
    sel.innerHTML='';
    state.projects.forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o); });
  }

  function openCounterDialog(counter){
    document.getElementById('dlgTitle').textContent = counter? 'Számláló szerkesztése' : 'Új számláló';
    fillProjectSelect(counterProject);
    btnDeleteCounter.style.display = counter? 'inline-flex':'none';

    if(counter){
      counterId.value = counter.id;
      counterName.value = counter.name;
      counterWhen.value = new Date(counter.deadline).toISOString().slice(0,16);
      counterProject.value = counter.projectId || (state.projects[0]?.id||'');
    }else{
      counterId.value = '';
      counterName.value = '';
      counterWhen.value = new Date(Date.now()+3600_000).toISOString().slice(0,16); // +1h
      counterProject.value = state.projects[0]?.id || '';
    }

    counterDialog.showModal();
  }

  counterForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const id = counterId.value || uid('ctr');
    const existing = byId(state.counters,id);
    const data = {
      id,
      name: counterName.value.trim(),
      deadline: parseLocalDateTime(counterWhen.value),
      projectId: counterProject.value || null,
    };
    if(!existing){
      state.counters.push({ ...data, archived:false, createdAt:Date.now(), order: (state.counters.length? Math.max(...state.counters.map(x=>x.order||0))+1:0) });
    }else{
      Object.assign(existing, data);
    }
    counterDialog.close();
    renderAll();
  });

  btnDeleteCounter.addEventListener('click', ()=>{
    const id = counterId.value; if(!id) return;
    const i = state.counters.findIndex(c=>c.id===id); if(i>=0) state.counters.splice(i,1);
    counterDialog.close(); renderAll();
  });

  btnQuickNewProject.addEventListener('click', ()=>{
    openProjectDialog();
  });

  // ======= Projekt létrehozás/szerkesztés =======
  const projectDialog = document.getElementById('projectDialog');
  const projectForm = document.getElementById('projectForm');
  const projectIdEl = document.getElementById('projectId');
  const projectNameEl = document.getElementById('projectName');
  const projectColorEl = document.getElementById('projectColor');
  const projectFontEl = document.getElementById('projectFont');
  const btnDeleteProject = document.getElementById('btnDeleteProject');

  function openProjectDialog(project){
    document.getElementById('projDlgTitle').textContent = project? 'Projekt szerkesztése' : 'Új projekt';
    btnDeleteProject.style.display = project? 'inline-flex':'none';
    if(project){
      projectIdEl.value = project.id;
      projectNameEl.value = project.name;
      projectColorEl.value = toHex(project.color||'#6ea8fe');
      projectFontEl.value = project.font||'default';
    }else{
      projectIdEl.value='';
      projectNameEl.value='';
      projectColorEl.value='#6ea8fe';
      projectFontEl.value='default';
    }
    projectDialog.showModal();
  }

  function toHex(color){
    // már hex? vissza
    if(/^#([0-9a-f]{3}){1,2}$/i.test(color)) return color;
    // rgb(a) → hex
    const m = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i); if(!m) return '#6ea8fe';
    return '#'+[m[1],m[2],m[3]].map(n=> Number(n).toString(16).padStart(2,'0')).join('');
  }

  projectForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const id = projectIdEl.value || uid('prj');
    const existing = byId(state.projects, id);
    const data = { id, name: projectNameEl.value.trim(), color: projectColorEl.value, font: projectFontEl.value };
    if(!existing){ state.projects.push(data); }
    else{ Object.assign(existing, data); }
    projectDialog.close();
    // ha számláló dialógus nyitva volt, frissítsük a projekt listát
    if(counterDialog.open) fillProjectSelect(counterProject);
    renderAll();
  });

  btnDeleteProject.addEventListener('click', ()=>{
    const id = projectIdEl.value; if(!id) return;
    // referenciák törlése a számlálókból
    state.counters.forEach(c=>{ if(c.projectId===id) c.projectId=null; });
    const i = state.projects.findIndex(p=>p.id===id); if(i>=0) state.projects.splice(i,1);
    projectDialog.close(); renderAll();
  });

  // ======= Oldalsáv gombok, beállítások =======
  document.getElementById('btnNewCounter').addEventListener('click', ()=>{
    if(!state.projects.length){ // hozzunk létre gyorsan egy alap projektet
      state.projects.push({id:uid('prj'), name:'Alap', color:'#6ea8fe', font:'default'});
    }
    openCounterDialog();
  });

  document.getElementById('btnNewProject').addEventListener('click', ()=> openProjectDialog());

  sortSel.addEventListener('change', ()=>{ state.sortMode = sortSel.value; renderAll(); });
  showArchivedChk.addEventListener('change', ()=>{ state.showArchived = showArchivedChk.checked; renderAll(); });
  projectFilterSel.addEventListener('change', ()=>{ state.projectFilter = projectFilterSel.value; renderAll(); });

  // ======= ICS import és előtöltés =======
  const icsInput = document.getElementById('icsInput');
  const calendarList = document.getElementById('calendarList');

  icsInput.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files||[]);
    for(const file of files){
      const text = await file.text();
      const cal = parseICS(text);
      cal.id = uid('cal'); cal.name = file.name;
      state.calendars.push(cal);
    }
    renderCalendars();
  });

  function renderCalendars(){
    calendarList.innerHTML='';
    if(!state.calendars.length){
      const x = document.createElement('div'); x.className='cal-item'; x.textContent='Még nincs betöltött naptár.'; calendarList.append(x); return;
    }
    state.calendars.forEach(cal=>{
      const wrap = document.createElement('details');
      wrap.className='cal-item';
      const sum = document.createElement('summary'); sum.textContent = `${cal.name} — ${cal.events.length} esemény`;
      wrap.append(sum);
      cal.events.slice(0,500).forEach(ev=>{
        const row = document.createElement('div'); row.className='event'; row.title='Dupla katt: előtöltés új számlálóhoz';
        const left = document.createElement('div'); left.textContent = ev.summary || '(nincs cím)';
        const right = document.createElement('div'); right.className='when'; right.textContent = new Date(ev.dtstart).toLocaleString();
        row.append(left,right);
        row.addEventListener('dblclick', ()=>{
          // előtöltés a számláló dialógusba
          if(!state.projects.length){ state.projects.push({id:uid('prj'), name:'Alap', color:'#6ea8fe', font:'default'}); }
          openCounterDialog();
          counterName.value = ev.summary || '';
          counterWhen.value = new Date(ev.dtstart).toISOString().slice(0,16);
        });
        wrap.append(row);
      });
      calendarList.append(wrap);
    });
  }

  function parseICS(ics){
    // Egyszerű .ics parser VEVENT szintre (DTSTART/DTEND/SUMMARY). Nem kezeli az időzóna aliasokat és RRULE-t.
    const lines = ics.replace(/\r/g,'').split(/\n(?=[A-Z-]+[:;])/).map(l=> l.trim());
    const events = [];
    let inEvent = false; let buf = {};
    for(let raw of lines){
      if(raw.startsWith('BEGIN:VEVENT')){ inEvent=true; buf={}; continue; }
      if(raw.startsWith('END:VEVENT')){ inEvent=false; if(buf.dtstart){ events.push(buf); } buf={}; continue; }
      if(!inEvent) continue;
      // unfold folytató sorok (nagyon egyszerűen)
      const line = raw;
      if(line.startsWith('DTSTART')){
        buf.dtstart = icsDateToMs(line);
      }else if(line.startsWith('DTEND')){
        buf.dtend = icsDateToMs(line);
      }else if(line.startsWith('SUMMARY:')){
        buf.summary = line.slice(8).trim();
      }else if(line.startsWith('UID:')){
        buf.uid = line.slice(4).trim();
      }
    }
    return { events };
  }

  function icsDateToMs(line){
    // Példák: DTSTART:20250101T120000Z  | DTSTART;TZID=Europe/Budapest:20250101T13000000
    const mTz = line.match(/^DTSTART(?:;TZID=([^:;]+))?:(\d{8}T\d{6}Z?)/);
    if(!mTz) return Date.now();
    const [, tz, val] = mTz;
    const year = +val.slice(0,4), mon=+val.slice(4,6)-1, day=+val.slice(6,8), hh=+val.slice(9,11), mm=+val.slice(11,13), ss=+val.slice(13,15);
    if(val.endsWith('Z')){ return Date.UTC(year,mon,day,hh,mm,ss); }
    // ha van TZID, most lokálisnak tekintjük (egyszerűsítés)
    return new Date(year,mon,day,hh,mm,ss).getTime();
  }

  // ======= Billentyűk =======
  window.addEventListener('keydown', (e)=>{
    if(e.key==='n' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); document.getElementById('btnNewCounter').click(); }
  });

  </script>
</body>
